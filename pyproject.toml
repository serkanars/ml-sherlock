[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ml-sherlock"
version = "0.1.0"
description = "Investigate why machine learning models fail in production."
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["pandas>=2.0","numpy>=1.24","scikit-learn>=1.3","xgboost>=2.0","lightgbm>=4.0","mlflow>=2.10","scipy>=1.10","jinja2>=3.1","PyYAML>=6.0","matplotlib>=3.7"]

[project.optional-dependencies]
openai = ["openai>=1.0"]

[project.scripts]
ml-sherlock = "autoresearch.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
autoresearch = ["reporting/*.html"]
