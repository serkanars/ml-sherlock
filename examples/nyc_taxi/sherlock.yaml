project:
  target: trip_duration_minutes
data:
  train_path: data/train.csv
  production_path: data/production.csv
tracking:
  uri: sqlite:///examples/nyc_taxi/mlflow.db
  experiment_name: example-nyc-taxi
model:
  random_state: 42
  selection_metric: rmse
  candidates: [random_forest, extra_trees, xgboost, lightgbm]
research:
  drift_p_value_threshold: 0.05
  adaptation_fraction: 0.5
  min_improvement_pct: 1.0
  max_experiments: 6
  allowed_actions: [retrain_recent_data, drop_drifted_features, model_search]
llm:
  enabled: true
  provider: ollama
  model: gemma4:31b-cloud
  base_url: http://localhost:11434
  temperature: 0.1
report:
  output_path: output/report.html
