version: 1

data:
  target: target
  train: train.csv
  production: production.csv

tracking:
  uri: sqlite:///artifacts/mlflow.db
  experiment: ml-sherlock

models:
  candidates: [random_forest, extra_trees, xgboost, lightgbm]
  selection_metric: rmse
  random_state: 42

investigation:
  drift:
    enabled: true
    p_value_threshold: 0.05
  error_analysis:
    enabled: true
    metrics: [rmse, mae, mape, r2]
  segments:
    enabled: false

experiments:
  max_iterations: 15
  adaptation_fraction: 0.5
  min_improvement_pct: 1.0
  allowed_actions: [retrain_recent_data, model_search, drop_drifted_features]

llm:
  enabled: true
  provider: ollama
  model: gemma4:31b-cloud
  base_url: http://localhost:11434
  temperature: 0.1

report:
  output: artifacts/report.html
